<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../third_party/dsh-theme/design-platform.css">
<link rel="stylesheet" href="../../third_party/dsh-theme/base.css">
<title>dsh 还没启动</title>
<style>
  html,body{margin:0;height:100%;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);
    font:14px/1.7 var(--dsw-font-family);display:grid;place-items:center}
  .box{max-width:460px;padding:28px 30px;border:1px solid var(--dsw-alias-border-l2);
    border-radius:var(--dsw-radius-lg);background:var(--dsw-alias-bg-layer-1)}
  h1{margin:0 0 10px;font-size:15px;font-weight:600}
  p{margin:0 0 8px;color:var(--dsw-alias-label-secondary);font-size:13px}
  code{background:var(--dsw-alias-markdown-code-block);padding:1px 5px;border-radius:var(--dsw-radius-xs);
    font-family:var(--ds-font-family-code);font-size:12.5px}
  ol{margin:10px 0 0;padding-left:20px;color:var(--dsw-alias-label-secondary);font-size:13px}
  li{margin:4px 0}
</style>
</head>
<body>
  <div class="box">
    <h1>dsh 还没在跑</h1>
    <p>这个标签页显示的是 dsh 自己的 Web 界面，需要先把 dsh 启动起来。</p>
    <ol>
      <li>回到「配置页」标签</li>
      <li>在概览里点「启动 dsh」</li>
      <li>等状态变成运行中，再切回这里</li>
    </ol>
  </div>
</body>
</html>
