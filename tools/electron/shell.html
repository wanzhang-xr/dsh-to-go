<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH to go</title>
<!-- 设计语言与官方 Web UI 同源：直接引用 third_party/dsh-theme 的官方 token -->
<link rel="stylesheet" href="../../third_party/dsh-theme/design-platform.css">
<link rel="stylesheet" href="../../third_party/dsh-theme/base.css">
<link rel="stylesheet" href="../../third_party/dsh-theme/corner-shape.css">
<link rel="stylesheet" href="../../third_party/dsh-theme/scrollbar.css">
<link rel="stylesheet" href="../../third_party/dsh-theme/focus.css">
<style>
  /* ⚠️ 官方的 --dsw-alias-* 定义在 body 上：派生变量必须写在 body 规则里，
     写进 :root 会取到空值（顶栏曾因此整条发白）。 */
  *{box-sizing:border-box}
  html{background:transparent}   /* 底色由 body 与窗口背景决定，浅色模式不会闪深底 */
  body{
    --bar-h: 54px;
    --bar-bg: var(--dsw-alias-bg-base, #232324);   /* 与配置页 body 基色一致，避免边界出现一条更亮的边 */
    --bar-line: var(--dsw-alias-border-l1, #2a2a2b);
    margin:0;padding:0;height:100%;overflow:hidden;background:var(--bar-bg);color:var(--dsw-alias-label-primary);
    font:13px/1.4 var(--dsw-font-family);-webkit-font-smoothing:antialiased;user-select:none}
  .bar{display:flex;align-items:center;height:var(--bar-h);border-bottom:1px solid var(--bar-line);padding-left:12px}
  .drag{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;height:100%;-webkit-app-region:drag}

  .brand{font-family:var(--dsw-font-family-brand);font-weight:500;font-size:15px;letter-spacing:.3px;
    color:var(--dsw-alias-label-primary);white-space:nowrap;flex:0 0 auto}
  .brand em{font-style:normal;color:var(--dsw-alias-label-tertiary);font-weight:400;margin-left:8px;font-size:12.5px}

  /* 分区导航：和配置页里的 nav 同一套观感（34px 胶囊 / 13px / 2px 间距） */
  .nav{display:flex;align-items:center;gap:2px;-webkit-app-region:no-drag;min-width:0;overflow:hidden}
  .tab{display:flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:1px solid transparent;
    border-radius:var(--dsw-radius-sm);background:transparent;color:var(--dsw-alias-label-secondary);
    font:inherit;font-size:14px;white-space:nowrap;cursor:pointer;
    transition:background var(--ds-transition-duration-fast) var(--ds-ease-in-out),
               color var(--ds-transition-duration-fast) var(--ds-ease-in-out),
               border-color var(--ds-transition-duration-fast) var(--ds-ease-in-out)}
  .tab:hover{background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary)}
  .tab[aria-selected="true"]{background:var(--dsw-alias-interactive-bg-active);color:var(--dsw-alias-label-primary);font-weight:500}
  /* 「dsh 界面」是另一个 webview，用竖线与配置页的分区隔开 */
  .sep{width:1px;height:20px;background:var(--bar-line);margin:0 6px;flex:0 0 auto}
  .tab.web{color:var(--dsw-alias-label-secondary)}
  .tab.web svg{width:13px;height:13px;opacity:.85}

  .right{display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag;height:100%;
    flex:0 0 auto;min-width:0;padding-left:8px}
  .port{flex:0 0 auto;font-size:12.5px;color:var(--dsw-alias-label-tertiary);border:1px solid var(--bar-line);
    border-radius:var(--dsw-radius-xs);padding:2px 8px;white-space:nowrap}

  /* dsh 运行状态：标题栏里的一个小 chip（绿点=运行中，灰点=已停止） */
  .status{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:var(--dsw-radius-xs);
    border:1px solid var(--bar-line);font-size:12.5px;color:var(--dsw-alias-label-secondary);white-space:nowrap;
    flex:0 1 auto;min-width:0;overflow:hidden}
  #status-text{overflow:hidden;text-overflow:ellipsis}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--dsw-alias-label-tertiary);flex:0 0 auto}
  .status.on .dot{background:var(--dsw-alias-state-success-primary)}
  .status.on{color:var(--dsw-alias-label-primary)}
  .status .slot{color:var(--dsw-alias-label-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 主题按钮：深色 → 浅色 → 自适应 三态循环 */
  .tbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--bar-line);
    border-radius:var(--dsw-radius-sm);background:transparent;color:var(--dsw-alias-label-secondary);
    font:inherit;font-size:13px;cursor:pointer;-webkit-app-region:no-drag;
    transition:background var(--ds-transition-duration-fast) var(--ds-ease-in-out),color var(--ds-transition-duration-fast) var(--ds-ease-in-out)}
  .tbtn:hover{background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary)}
  .tbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none}

  .wbtn{flex:0 0 auto;width:48px;height:var(--bar-h);display:grid;place-items:center;border:0;background:transparent;cursor:pointer;
    color:var(--dsw-alias-label-secondary);-webkit-app-region:no-drag;
    transition:background var(--ds-transition-duration-fast) var(--ds-ease-in-out),color var(--ds-transition-duration-fast) var(--ds-ease-in-out)}
  .wbtn:hover{background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary)}
  .wbtn.close:hover{background:#d13438;color:#fff}
  .wbtn svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.2;fill:none}

  /* 页面里有弹层时，标题栏一起压暗：否则上面亮一条、下面被压黑，看着像两层 */
  .bar{position:relative}

  /* 拖动/缩放期间：过渡全关、动画暂停、去掉会重算的重绘制 */
  body.resizing *, body.resizing *::before, body.resizing *::after{
    transition: none !important;
    animation-play-state: paused !important;
  }

  /* 平时给会变的元素补一点过渡，别硬切 */
  .status, .status .dot, .tab, .brand em{
    transition: color .16s var(--ds-ease-in-out), background-color .16s var(--ds-ease-in-out),
                border-color .16s var(--ds-ease-in-out), opacity .16s var(--ds-ease-in-out);
  }
  .status .dot{ transition: background-color .2s var(--ds-ease-in-out), transform .2s var(--ds-ease-in-out); }
  .status.on .dot{ transform: scale(1.08); }

  /* 窄窗口逐级让位，保证右侧窗口按钮和主题按钮永远完整可见 */
  /* 用 JS 算出的档位类来控制让位（带死区），而不是 @media ——
     否则拖到断点附近元素会来回闪现，看着"鬼畜" */
  body.lv1 .port { display: none }
  body.lv2 #status-slot { display: none }
  body.lv3 #theme-label { display: none }
  body.lv3 .tbtn { padding: 0 8px }
  body.lv4 .brand em { display: none }
  body.lv4 #status-text { display: none }
  body.lv4 .status { padding: 0 8px }
  body.lv5 .status { display: none }
  body.dim .bar::after{content:'';position:absolute;inset:0;background:var(--dsw-alias-bg-mask-3, rgb(0 0 0 / 48%));pointer-events:none}
</style>
</head>
<body data-ds-dark-theme>
<div class="bar">
  <div class="drag">
    <span class="brand">DSH to go<em>便携版 DeepSeek Harness</em></span>
    <div class="nav" role="tablist" aria-label="配置页分区与 dsh 界面">
      <button class="tab" role="tab" data-section="overview" aria-selected="true">概览</button>
      <button class="tab" role="tab" data-section="sites" aria-selected="false">站点和模型</button>
      <button class="tab" role="tab" data-section="upgrade" aria-selected="false">升级</button>
      <button class="tab" role="tab" data-section="diag" aria-selected="false">诊断</button>
      <button class="tab" role="tab" data-section="plugins" aria-selected="false">插件</button>
      <button class="tab" role="tab" data-section="launcher" aria-selected="false">启动器</button>
      <span class="sep"></span>
      <button class="tab web" role="tab" data-section="__web" aria-selected="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 3.5h11v9h-11z"/><path d="M2.5 6.5h11"/></svg>
        dsh 界面
      </button>
    </div>
  </div>
  <div class="right">
    <span class="status" id="status" hidden><span class="dot"></span><span id="status-text">—</span><span class="slot" id="status-slot"></span></span>
    <span class="port" id="port" hidden></span>
    <button class="tbtn" id="btn-theme" aria-label="深色 / 浅色 / 自适应">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      <span id="theme-label">深色</span>
    </button>
    <button class="wbtn" id="btn-min" aria-label="最小化"><svg viewBox="0 0 10 10"><path d="M2 5h6"/></svg></button>
    <button class="wbtn" id="btn-max" aria-label="最大化"><svg viewBox="0 0 10 10"><rect x="2.5" y="2.5" width="5" height="5"/></svg></button>
    <button class="wbtn close" id="btn-close" aria-label="关闭"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"/></svg></button>
  </div>
</div>
<script src="shell.js"></script>
</body>
</html>
